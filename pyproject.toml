[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mini-harness"
version = "0.3.0"
description = "个人知识库治理 Agent —— 基于 DeepSeek Harness 的 Python Headless 实现"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.28,<1",
  "httpx-sse>=0.4,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
mini-harness = "mini_harness.__main__:main"
mini-harness-client = "mini_harness.rpc_client:main"

[tool.hatch.build.targets.wheel.force-include]
"src/mini_harness" = "mini_harness"
