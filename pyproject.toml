[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mini-harness"
version = "0.3.0"
description = "个人知识库治理 Agent —— 基于 DeepSeek Harness 的 Python Headless 实现"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.28,<1",
  "httpx-sse>=0.4,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.1,<2",
  "tokenizers>=0.21,<1",
]

[project.scripts]
mini-harness = "mini_harness.__main__:main"
mini-harness-client = "mini_harness.rpc_client:main"
mini-harness-ui = "mini_harness.ui:main"

[project.optional-dependencies]
rag-embedding = [
    "torch==2.14.1",
    "transformers==5.19.0",
    "psutil==7.2.2",
]
rag-parser = [
    "docling==2.137.0",
    "psutil==7.2.2",
]
rag-adapter = [
    "llama-index-core==0.14.25",
]

[tool.hatch.build.targets.wheel.force-include]
"src/mini_harness" = "mini_harness"
